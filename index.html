<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pet Love Petshop | Banho, tosa e cuidado veterinário</title>
  <meta name="description"
    content="Pet Love Petshop: banho e tosa, consultas veterinárias, vacinação, hotelzinho e táxi pet. Cuidado de verdade para o seu melhor amigo.">
  <meta name="author" content="Ana Paula Althoff">
  <meta name="theme-color" content="#e87ac9">

  <!-- Ícones da aba do navegador -->
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <!-- Tipografia externa: Google Fonts (Roboto para leitura, Baloo 2 para destaques) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Biblioteca de ícones: Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- Estilos do projeto -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <!-- Atalho de acessibilidade para quem navega pelo teclado -->
  <a class="pular-conteudo" href="#inicio">Pular para o conteúdo</a>

  <!-- ====================== CABEÇALHO ====================== -->
  <header class="cabecalho" id="cabecalho">
    <div class="container cabecalho__conteudo">

      <a href="#inicio" class="marca" aria-label="Pet Love Petshop, ir para o início">
        <img src="assets/img/logo-simbolo.png" alt="" class="marca__simbolo" width="52" height="52">
        <span class="marca__nome">Pet<span class="marca__nome-destaque">Love</span></span>
      </a>

      <nav class="navegacao" id="navegacao" aria-label="Navegação principal">
        <ul class="navegacao__lista">
          <li><a class="navegacao__link" href="#inicio">Início</a></li>
          <li><a class="navegacao__link" href="#sobre">Sobre</a></li>
          <li><a class="navegacao__link" href="#servicos">Serviços</a></li>
          <li><a class="navegacao__link" href="#depoimentos">Depoimentos</a></li>
          <li><a class="navegacao__link" href="#contato">Contato</a></li>
        </ul>
        <a href="#contato" class="botao botao--primario navegacao__botao">
          <i class="bi bi-calendar2-heart" aria-hidden="true"></i>
          Agendar
        </a>
      </nav>

      <button class="abrir-menu" id="abrir-menu" type="button" aria-label="Abrir menu de navegação"
        aria-expanded="false" aria-controls="navegacao">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>

    </div>
  </header>

  <!-- Camada escura exibida atrás do menu no celular -->
  <div class="fundo-menu" id="fundo-menu" hidden></div>

  <main id="inicio">
    <!-- As seções da página serão construídas nas próximas etapas -->
  </main>

  <script src="assets/js/script.js"></script>
</body>

</html>
